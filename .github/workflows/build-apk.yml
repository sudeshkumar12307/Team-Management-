name: Build Android APK
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Android wrapper project
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          mkdir apk && cd apk
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir www
          echo '<!doctype html><html><body>Loading...</body></html>' > www/index.html
          node -e "require('fs').writeFileSync('capacitor.config.json', JSON.stringify({appId:'com.cybercafe.manager',appName:'Cyber Cafe Manager',webDir:'www',server:{url:process.env.APP_URL,cleartext:false}}, null, 2))"
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CyberCafeManager-apk
          path: apk/android/app/build/outputs/apk/debug/app-debug.apk
